[package]
name = "lisca-binding"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Single-particle LNP binding assay analysis (Picasso localization -> filter -> spot-counts -> traces -> plots) for LiSCA workspaces."
readme = "../../README.md"
rust-version = "1.85"

[lib]
name = "lisca_binding"
path = "src/lib.rs"

[[bin]]
name = "lisca-analyze"
path = "src/bin/lisca-analyze.rs"

[dependencies]
csv = "1.3"
marray = { git = "https://github.com/keejkrej/marray-rs", rev = "af67ac2d833f55e069f286022d0a0de0b9547bfb", version = "1.0.0", default-features = false, features = ["np", "sp"] }
mplot = { git = "https://github.com/keejkrej/mplot-rs", rev = "8a596cdcb0f45eb1d48252b5c36c5d68ebfc2842", version = "1.0.0" }
picasso = { git = "https://github.com/keejkrej/picasso-rs", rev = "bc1ba5e580fb012f861860030fef4fac748ec2f6", version = "0.11.3" }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiff = "0.10"
yeslogic-fontconfig-sys = { version = "6.0.0", features = ["dlopen"] }

[dev-dependencies]
approx = "0.5"
csv = "1.3"
serde_json = "1"
tempfile = "3"
tiff = "0.10"
